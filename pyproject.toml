[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "sd3-large-api"
version = "0.1.0"
description = "Stable Diffusion 3.5 Large API service with multi-platform GPU support"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "sd3_api", from = "src"}]
homepage = "https://github.com/yourusername/sd3-large-docker"
repository = "https://github.com/yourusername/sd3-large-docker"
keywords = ["stable-diffusion", "ai", "image-generation", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
torch = ">=2.0.0"
torchvision = ">=0.15.0"
torchaudio = ">=2.0.0"
diffusers = ">=0.32.0"
transformers = ">=4.48.0"
Pillow = "^10.0.0"
accelerate = ">=1.0.0"
huggingface-hub = "^0.26.0"
protobuf = "^5.0.0"
sentencepiece = "^0.2.0"
# LoRA training and management
peft = "^0.8.0"
datasets = "^2.16.0"
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
aiofiles = "^23.2.0"
celery = "^5.3.0"
redis = "^5.0.0"
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = "^23.0"
isort = "^5.12"
flake8 = "^6.0"
mypy = "^1.5"

[tool.poetry.scripts]
sd3-api = "sd3_api.api:app"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true